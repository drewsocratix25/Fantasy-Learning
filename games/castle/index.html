<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Castle Quest</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Explore a castle full of treasures and discover how the world works: weather, plants, sink or float, animals, heavy and light.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Castle Quest">
<meta name="theme-color" content="#1d4ed8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">

<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <canvas id="game" aria-label="Castle Quest game"></canvas>
  <div id="nameWrap" hidden>
    <label for="nameInput">Explorer name</label>
    <input id="nameInput" type="text" maxlength="14" autocomplete="off" autocapitalize="words" placeholder="Type a name">
  </div>
</div>
<div id="rotate" hidden><div>📱 ➡️ 🔄<br>Please turn sideways!</div></div>

<script src="js/config.js"></script>
<script src="../../engine/save.js"></script>

<script src="js/title.js"></script>
<script src="js/castle.js"></script>
<script src="../../engine/quiz.js"></script>
<script src="js/games/tower.js"></script>
<script src="js/games/greenhouse.js"></script>
<script src="js/games/lab.js"></script>
<script src="js/games/menagerie.js"></script>
<script src="js/games/vault.js"></script>
<script src="../../engine/main.js"></script>

</html>
