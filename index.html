<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#153e43" />
    <meta
      name="description"
      content="A little world of big discoveries. Six gentle, playful learning adventures for ages 3–6. No ads, accounts, or purchases."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Little Wonders" />
    <title>Little Wonders · A world to discover</title>
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="hub.css" />
    <script type="module" src="app/main.mjs"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to play</a>
    <header class="topbar">
      <a class="brand" href="#" aria-label="Little Wonders home"
        ><span class="brand-mark" aria-hidden="true">✳</span
        ><span>little<span class="brand-bottom">wonders</span></span></a
      >
      <nav aria-label="Game controls">
        <button
          class="tool"
          id="sound"
          aria-label="Turn sound off"
          aria-pressed="true"
        >
          <span aria-hidden="true">♫</span
          ><span class="tool-label">Sound on</span>
        </button>
        <button class="tool" id="collection" aria-label="My discoveries">
          <span aria-hidden="true">✷</span
          ><span class="tool-label">My discoveries</span
          ><span class="count" id="discovery-count">0</span>
        </button>
        <button
          class="tool grownups"
          id="grownups"
          aria-label="Grown-up corner"
        >
          <span aria-hidden="true">⚙</span
          ><span class="tool-label">Grown-ups</span>
        </button>
      </nav>
    </header>
    <main id="main" tabindex="-1"></main>
    <p
      class="live-region"
      id="announce"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></p>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <noscript
      ><div class="no-script">
        <h1>Let’s get ready to play</h1>
        <p>Little Wonders needs JavaScript turned on in your browser.</p>
      </div></noscript
    >
  </body>
</html>
